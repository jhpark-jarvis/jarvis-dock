name: Desktop CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform-check:
    name: Check and package (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows
            os: windows-latest
          - label: macOS
            os: macos-latest
          - label: Linux
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Install Linux display dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends xvfb xauth
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:unit
      - run: npm run package
      - name: Run packaged smoke (Linux)
        if: matrix.os == 'ubuntu-latest'
        working-directory: apps/desktop
        run: xvfb-run -a node tests/smoke/packaged.smoke.cjs
      - name: Run packaged smoke (Windows and macOS)
        if: matrix.os != 'ubuntu-latest'
        working-directory: apps/desktop
        run: node tests/smoke/packaged.smoke.cjs

  windows-runtime:
    name: Electron runtime regression (Windows)
    needs: platform-check
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
      - run: npm run make
